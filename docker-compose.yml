services:
  db:
    image: postgres:18
    container_name: pern-postgres-compose
    restart: unless-stopped
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: uptime_monitor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docker -d uptime_monitor"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: pern-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DB_USER: docker
      DB_PASSWORD: password123
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: uptime_monitor
    depends_on:
      db:
        condition: service_healthy

  client:
    build: ./client
    container_name: pern-client
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  pgdata:
